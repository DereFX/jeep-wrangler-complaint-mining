name: Build AWS deployment images

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-image-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/wrangler-claims-backend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/wrangler-claims-backend:latest

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/wrangler-claims-dashboard:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/wrangler-claims-dashboard:latest

      - name: Write deployment image addresses
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          {
            echo "## AWS images published"
            echo ""
            echo "Backend: \`$REGISTRY/wrangler-claims-backend:$IMAGE_TAG\`"
            echo "Dashboard: \`$REGISTRY/wrangler-claims-dashboard:$IMAGE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
